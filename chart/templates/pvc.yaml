{{- if .Values.persistence.enabled }}
# The plugin's install store: the records of what the setup wizard created on
# AInsel, which have to outlive a pod restart. It is the only writable place the
# container has -- the root filesystem is read-only -- so the Deployment mounts it
# at /data and points $DATA_DIR at that mount.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "forgejo.pvcName" . }}
  labels:
    {{- include "forgejo.labels" . | nindent 4 }}
spec:
  # ReadWriteOnce: the Deployment runs a single replica, and the store is written
  # by the replica that is serving, not by several at once.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  # An empty storageClass is left out rather than rendered, so the cluster's
  # default StorageClass is what provisions this claim.
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
