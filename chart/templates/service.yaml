apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgejo.fullname" . }}
  labels:
    {{- include "forgejo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "forgejo.selectorLabels" . | nindent 4 }}
  ports:
    # Named http, the same name the Deployment's container port uses, so the
    # target follows the port instead of hardcoding a number.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
