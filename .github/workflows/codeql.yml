name: CodeQL

# Static analysis of the two languages this repository ships, beside (not
# instead of) vet/govulncheck/eslint: CodeQL models data flow, which is what
# matters for the parts that touch tokens, the Forgejo API and the console DOM.
# Runs on pushes to main, on pulls that target main, and weekly — the same
# three-time pattern as the scheduled CI mirror, offset to a different minute.
#
# build-mode: none for both languages: Go is analysed without compiling, and
# the TypeScript here needs no emit to be queried, so the job never needs a
# toolchain step with secrets within reach.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF for the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
          - language: javascript-typescript
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
