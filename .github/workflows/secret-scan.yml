name: Secret scan

# The scan that was run by hand for issue #19, made a gate. History, not the working tree: a
# secret's home in a git repository is the commit it was written into, and a scan of HEAD alone
# says nothing about the commits a reader can still check out.
#
# Both triggers scan the whole history. The alternative — the pull request's commit range on a
# pull, full history on a schedule — is cheaper only when history is expensive to read; here it
# is 40 commits and 3 MB, and a range expression is one bad `--depth` away from silently
# scanning nothing. A shallow checkout is the failure mode this file is most afraid of, so the
# clone is unshallowed in one place and checked.

on:
  pull_request:
  schedule:
    # Monday 03:17 UTC — off the hour, so a scheduled scan does not join the crowd.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  TRUFFLEHOG_VERSION: 3.100.1

jobs:
  scan:
    name: gitleaks + trufflehog, full history
    runs-on: ubuntu-latest
    steps:
      - name: Check out the whole history
        uses: actions/checkout@v5
        with:
          # The whole point. `fetch-depth: 0` is what makes "full history" true.
          fetch-depth: 0

      - name: Check the clone is not shallow
        run: |
          if [ -e "$(git rev-parse --git-dir)/shallow" ]; then
            echo '::error::the clone is shallow — a full-history scan would be vacuous' >&2
            exit 1
          fi
          echo "commits available: $(git rev-list --count HEAD)"

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          gitleaks version

      - name: Scan the history with gitleaks
        # .gitleaksignore is honoured: it carries only findings triaged on
        # docs/security/, one fingerprint per line. No .gitleaks.toml exists, so nothing is
        # allowlisted by pattern.
        run: gitleaks git --redact --exit-code 1 .

      - name: Install trufflehog
        run: |
          curl -sSfL \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" trufflehog
          trufflehog --version

      - name: Scan the history with trufflehog
        # Verification off: a hit is a string whose owner has not been asked about it, and
        # sending an unknown credential to its provider to confirm it is the wrong first move.
        run: trufflehog git "file://$(pwd)" --no-verification --fail --json
