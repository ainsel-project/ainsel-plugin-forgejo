name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/deploy-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # pnpm before setup-node, so the pnpm store can be cached — and the same
      # version CI's UI job uses, so the site and the bundle are built alike.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: docs-site
        run: pnpm lint

      - name: Check formatting
        working-directory: docs-site
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}"

      # Reads the real docs/ too: an unlisted page or a dead link fails here
      # rather than in the published site.
      - name: Test
        working-directory: docs-site
        run: pnpm test

      - name: Build
        working-directory: docs-site
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
