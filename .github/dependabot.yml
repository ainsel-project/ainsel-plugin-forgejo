version: 2
updates:
  # The pins in .github/workflows/ are commit SHAs on purpose; Dependabot is what
  # makes them stay current. One grouped PR per ecosystem per week keeps the noise
  # down — six pinned actions across five workflows would otherwise arrive as six
  # red-then-green fires each.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go:
        patterns:
          - "*"

  # Both package.json directories: the UI the plugin embeds, and the docs site
  # the Pages deploy builds. They are independent lockfiles and get their own PRs.
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm:
        patterns:
          - "*"

  # The base image in the Dockerfile the release job builds and signs.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
