name: CI
# Every action below is pinned to a full commit SHA with its tag in a trailing
# comment; Dependabot (.github/dependabot.yml) opens the bump PRs. Floating refs
# let an upstream tag move under a workflow that did not ask for it — and the
# release workflow's file is the cosign signing identity installers trust
# (see release.yml), so the whole chain is pinned, not just that file.

# Every gate this plugin ships with, in the order it pays off: the cheap Go checks
# first, then the UI, then the chart, then the image build that ties them together.
# The docs site is checked beside them rather than only by the workflow that publishes
# it, so a doc that breaks the site fails the pull request instead of the deploy.
# The image is only built, never pushed — publishing is release.yml's job.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly mirror of the same gates, so a dependency that was fine at merge time
  # and gets an advisory next week still raises a red flag on the repository —
  # govulncheck is the check that rots silently if nobody runs it.
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # --- Go ---------------------------------------------------------------
      # go test reads the embedded ui/dist, which is committed as a placeholder
      # (.gitkeep), so the Go checks do not wait on the UI build.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # A gate, not documentation: red lint stops the merge. The pinned golangci-lint
      # must be built with a Go >= the go directive in go.mod — older builds of the
      # linter refuse this module outright.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Vet
        run: go vet ./...

      - name: Test the plugin binary
        run: go test ./...

      # Fixtures once carried a real person's login. The rename is only durable if
      # something checks it, and the check has to be a CI step: a rule nobody runs is
      # a rule the next copied fixture breaks.
      - name: Check for retired internal names
        run: bash scripts/check-no-internal-names.sh

      # vulncheck against the live Go advisory DB. The tool version is pinned so
      # the check itself cannot change under the job. Unlike the `uses:` pins it
      # lives in a run: string, which no Dependabot ecosystem tracks — it is
      # hand-bumped when govulncheck ships a new release; the weekly schedule
      # above bounds how stale a missed bump can get.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      # --- UI ---------------------------------------------------------------
      # pnpm is installed before setup-node so the pnpm store can be cached.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the UI bundle
        run: make ui

      - name: Test the UI
        run: pnpm -C ui test

      # --- Helm chart -------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Test the chart
        run: bash chart/tests/render_test.sh

      # --- Image ------------------------------------------------------------
      # The Dockerfile builds the UI itself, so a green build here proves the
      # whole thing assembles from a clean checkout, manifest and bundle
      # included. Nothing is pushed from CI.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the plugin image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          tags: ghcr.io/ainsel-project/ainsel-plugin-forgejo:ci
          push: false

  # The same checks the deploy workflow repeats before uploading the artifact. They are
  # repeated on purpose: CI says a pull request is sound, the deploy gate says the thing
  # actually published is sound, and only the second one can say that about `main`.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # pnpm before setup-node, so the setup-node cache can find the lockfile.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C docs-site install --frozen-lockfile

      - name: Lint the docs site
        run: pnpm -C docs-site lint

      # Vendored CSS is excluded by docs-site/.prettierignore, so "formatted" means
      # "as upstream shipped it" for those files rather than "reformatted by us".
      - name: Check formatting
        working-directory: docs-site
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}" "dev-server/**/*.ts"

      - name: Test the docs site
        run: pnpm -C docs-site test

      # Not only the typecheck: this is the step that copies `docs/` into `dist/`, so it
      # is where a doc the build cannot publish would surface.
      - name: Build the docs site
        run: pnpm -C docs-site build
