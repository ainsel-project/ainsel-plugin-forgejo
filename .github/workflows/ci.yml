name: CI

# Every gate this plugin ships with, in one job, in the order it pays off:
# the cheap Go checks first, then the UI, then the chart, then the image build
# that ties them together. The image is only built, never pushed — publishing
# is release.yml's job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # --- Go ---------------------------------------------------------------
      # go test reads the embedded ui/dist, which is committed as a placeholder
      # (.gitkeep), so the Go checks do not wait on the UI build.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test the plugin binary
        run: go test ./...

      # --- UI ---------------------------------------------------------------
      # pnpm is installed before setup-node so the pnpm store can be cached.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the UI bundle
        run: make ui

      - name: Test the UI
        run: pnpm -C ui test

      # --- Helm chart -------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Test the chart
        run: bash chart/tests/render_test.sh

      # --- Image ------------------------------------------------------------
      # The Dockerfile builds the UI itself, so a green build here proves the
      # whole thing assembles from a clean checkout, manifest and bundle
      # included. Nothing is pushed from CI.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the plugin image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ghcr.io/ainsel-project/ainsel-plugin-forgejo:ci
          push: false
