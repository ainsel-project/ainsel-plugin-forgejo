name: Deploy docs to GitHub Pages
# Every action below is pinned to a full commit SHA with its tag in a trailing
# comment; Dependabot (.github/dependabot.yml) opens the bump PRs. Floating refs
# let an upstream tag move under a workflow that did not ask for it — and the
# release workflow's file is the cosign signing identity installers trust
# (see release.yml), so the whole chain is pinned, not just that file.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/deploy-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # pnpm before setup-node, so the pnpm store can be cached — and the same
      # version CI's UI job uses, so the site and the bundle are built alike.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: docs-site
        run: pnpm lint

      - name: Check formatting
        working-directory: docs-site
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}" "dev-server/**/*.ts"

      # Reads the real docs/ too: an unlisted page or a dead link fails here
      # rather than in the published site.
      - name: Test
        working-directory: docs-site
        run: pnpm test

      - name: Build
        working-directory: docs-site
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
